[tool.pytest.ini_options]
testpaths = ["03_defense/AutoWrite/tests", "03_defense/MINJA/tests", "03_defense/Reflection/tests", "03_defense/External_Developer_Write/tests", "03_defense/MASW/tests"]
pythonpath = ["03_defense", "02_tools"]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py310"
extend-exclude = [".tools"]

[tool.ruff.lint]
select = ["F401", "F811", "F821", "F841"]
